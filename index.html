<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garmin Connect – My Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <header class="top-bar">
      <span class="avatar">OQ</span>
      <h1>My Day</h1>
      <span class="icon">🔔</span>
    </header>

    <main>
      <section class="card steps">
        <div class="ring">
          <div class="ring-inner">
            <strong>7,842</strong>
            <small>of 10,000 steps</small>
          </div>
        </div>
      </section>

      <section class="grid">
        <div class="card stat">
          <span class="label">❤️ Heart Rate</span>
          <strong>62 <small>bpm resting</small></strong>
        </div>
        <div class="card stat">
          <span class="label">⚡ Body Battery</span>
          <strong>74 <small>/ 100</small></strong>
        </div>
        <div class="card stat">
          <span class="label">😴 Sleep</span>
          <strong>7h 12m <small>score 81</small></strong>
        </div>
        <div class="card stat">
          <span class="label">🔥 Calories</span>
          <strong>1,940 <small>kcal</small></strong>
        </div>
      </section>

      <section class="card">
        <span class="label">Last Activity</span>
        <p class="activity">🏃 Morning Run · 5.2 km · 28:14</p>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="active">My Day</a>
      <a>Challenges</a>
      <a>Calendar</a>
      <a>News Feed</a>
      <a>More</a>
    </nav>
  </div>
</body>
</html>
